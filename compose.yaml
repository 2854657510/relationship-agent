services:
  postgres:
    image: postgres:16-alpine
    container_name: relationship-agent-db
    environment:
      POSTGRES_USER: relationship
      POSTGRES_PASSWORD: relationship
      POSTGRES_DB: relationship
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - relationship_pgdata:/var/lib/postgresql/data
      # 首次初始化时额外建测试库；已有 volume 不会重复执行。
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relationship -d relationship"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  relationship_pgdata:
